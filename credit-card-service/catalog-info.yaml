specVersion: vsf-idp.io/v2

metadata:
  domain: banking

  system: banking-system

  namespace: banking

  labels:
    tier: "2"
    boundary: core
    pii: "true"
    card-data: "true"
  annotations:
    repo: https://github.com/emre-unaldi/Banking-Microservices
    defaultBranch: main
    port: "8083"

spec:
  type: service

  id: credit-card-service

  name: Credit Card Service

  description: >-
    Quản lý thẻ tín dụng: số thẻ, ngày hết hạn, CVV, hạn mức và dư nợ. Trước khi lưu, gọi
    đồng bộ User Service và Bank Service để chắc chắn userId và bankId tồn tại; ngoài ra
    lộ hai endpoint đọc xuyên service /users/{userId} và /banks/{bankId}.

  owners:
    members:
      - user: emree.unaldi@gmail.com
        role: techlead

  review:
    branch: "main"

  runtime:
    language: Java 21
    framework: Spring Boot 3.2.4 / Spring Cloud 2023.0.1
    buildTool: maven
    libraries: [spring-boot-starter-data-jpa, spring-boot-starter-data-redis, spring-boot-starter-amqp, spring-cloud-starter-openfeign, spring-cloud-starter-netflix-eureka-client, mapstruct-1.5.5, lombok]
    ports:
      - { number: 8083, name: http, protocol: http, exposure: cluster }
  dataClassification: restricted
  syncDependencyPolicy:
    resolution: static-url
    timeout: none
<<<<<<< HEAD
    retry: "3 lần liên tiếp, không giãn cách"
=======
    retry: { attempts: 3, backoff: none, appliesTo: banking/invoices-api }
>>>>>>> 62aa550dfe999501f3cc498a7ed07770a4bc2b27
    circuitBreaker: none
    fallbackOnFailure: { value: "0.0", surfacedToCaller: false }

  topology:
    - ref: system:banking/banking-system
      reason: Component này là một phần của system banking-system

    - ref: providesApis:banking/credit-cards-api
      protocol: http
      reason: API /api/v1/creditCards cho gateway định tuyến vào

    - ref: consumesApis:banking/users-api
      protocol: http
      reason: Kiểm tra userId tồn tại trước khi lưu và phục vụ GET /creditCards/users/{userId}

    - ref: consumesApis:banking/banks-api
      protocol: http
      reason: Kiểm tra bankId tồn tại trước khi lưu và phục vụ GET /creditCards/banks/{bankId}

    - ref: consumesApis:banking/invoices-api
      protocol: http
      reason: Lấy hoá đơn của khách hàng để đặt dư nợ ban đầu lúc phát hành thẻ

    - ref: component:banking/discovery-client-service
      protocol: http
      reason: Đăng ký instance với Eureka Server

    - ref: resource:banking/postgres-db
      protocol: postgresql
      reason: Bảng credit_cards, truy vấn tổng hợp dư nợ và cập nhật trạng thái trên bảng invoices

    - ref: resource:banking/redis-db
      protocol: redis
      reason: Cache credit_card / credit_cards / credit_card_user / credit_card_bank

    - ref: resource:banking/rabbitmq-log
      protocol: rabbitmq
      reason: Broker nhận log nghiệp vụ

    - ref: publishesTo:banking/logs.queue
      protocol: rabbitmq
      reason: Phát log mỗi thao tác POST/PUT/DELETE/GET qua logs.exchange

c3:
  diagramType: C4Component
  title: C3 — Thành phần bên trong Credit Card Service

  components:
    - id: credit-card-controller
      name: CreditCardController
      technology: Spring MVC · /api/v1/creditCards
      description: Bảy endpoint — năm CRUD cộng /users/{userId} và /banks/{bankId}
      exposedPort: 8083
    - id: credit-card-service-impl
      name: CreditCardServiceImpl
      technology: Spring @Service · @Cacheable / @CachePut / @CacheEvict
      description: Toàn bộ nghiệp vụ, điều phối các Feign client trước khi ghi và làm mới dư nợ lúc đọc
    - id: credit-card-mapper
      name: CreditCardMapper
      technology: MapStruct 1.5.5
      description: Chuyển Request ↔ Entity ↔ DTO
    - id: credit-card-repository
      name: CreditCardRepository
      technology: Spring Data JPA · JpaRepository<CreditCard, Long>
      description: Chỉ dùng phương thức có sẵn, không khai query tuỳ biến
    - id: user-service-client
      name: UserServiceClient
      technology: OpenFeign · url tĩnh http://${USER_SERVICE_HOST}:8081
      description: GET /api/v1/users/{userId} — không timeout, không circuit breaker
    - id: bank-service-client
      name: BankServiceClient
      technology: OpenFeign · url tĩnh http://${BANK_SERVICE_HOST}:8082
      description: GET /api/v1/banks/{bankId} — không timeout, không circuit breaker
    - id: invoice-service-client
      name: InvoiceServiceClient
      technology: OpenFeign · url tĩnh http://${INVOICE_SERVICE_HOST}:8085
      operations: [GET /api/v1/invoices]
      pagination: none
      filtering: client-side  # lọc theo userId sau khi đã nhận toàn bộ danh sách
      invokedFrom: [save]
      description: Lấy hoá đơn của khách hàng để đặt dư nợ ban đầu cho thẻ
    - id: outstanding-debt-repository
      name: OutstandingDebtRepository
      technology: Spring JdbcTemplate · SQL thuần
      statements:
        - { sql: "SELECT COALESCE(SUM(amount), 0) FROM invoices WHERE user_id = ?", table: invoices, access: read }
        - { sql: "UPDATE invoices SET payment_status = 'PAID' WHERE user_id = ?", table: invoices, access: write }
      callPattern: per-row  # findAll chạy một truy vấn cho mỗi thẻ trong danh sách
      invokedFrom: [findById, findAll, update]
      description: Tính và đồng bộ dư nợ thẻ theo hoá đơn của khách hàng
    - id: redis-cache
      name: RedisConfiguration
      technology: RedisCacheManager · TTL 1 giờ · prefix credit-card-service
      description: Cache credit_card / credit_cards / credit_card_user / credit_card_bank
    - id: log-producer
      name: LogProducer
      technology: Spring AMQP · logs.exchange
      description: convertAndSend theo routingKey logs.routingKey

  internalRelations:
    - { from: credit-card-controller,   to: credit-card-service-impl, description: Uỷ quyền toàn bộ nghiệp vụ }
    - { from: credit-card-service-impl, to: user-service-client,      description: Bước 1 — kiểm tra userId tồn tại }
    - { from: credit-card-service-impl, to: bank-service-client,      description: Bước 2 — kiểm tra bankId tồn tại }
    - { from: credit-card-service-impl, to: invoice-service-client,   description: Bước 3 — tính dư nợ ban đầu từ hoá đơn của khách hàng }
    - { from: credit-card-service-impl, to: credit-card-repository,   description: Bước 4 — đọc/ghi bản ghi CreditCard }
    - { from: credit-card-service-impl, to: outstanding-debt-repository, description: Làm mới debt_amount trong findById và mỗi phần tử của findAll }
    - { from: credit-card-service-impl, to: outstanding-debt-repository, description: Đánh dấu hoá đơn đã trả sau khi cập nhật thẻ về dư nợ 0 }
    - { from: credit-card-service-impl, to: credit-card-mapper,       description: Chuyển Request/Entity/DTO }
    - { from: credit-card-service-impl, to: redis-cache,              description: Đọc/xoá cache trước và sau mỗi thao tác }
    - { from: credit-card-service-impl, to: log-producer,             description: Ghi log mỗi thao tác POST/PUT/DELETE/GET }

  externalRelations:
    - { from: user-service-client,     to: banking/user-service, technology: HTTP,     description: "GET /api/v1/users/{userId}" }
    - { from: bank-service-client,     to: banking/bank-service, technology: HTTP,     description: "GET /api/v1/banks/{bankId}" }
    - { from: invoice-service-client,  to: banking/invoice-service, technology: HTTP,  description: GET /api/v1/invoices }
    - { from: credit-card-repository,  to: banking/postgres-db,  technology: JDBC,     description: Bảng credit_cards }
    - { from: outstanding-debt-repository, to: banking/postgres-db, technology: JDBC,  description: Truy vấn tổng hợp và cập nhật trạng thái trên bảng invoices }
    - { from: redis-cache,             to: banking/redis-db,     technology: RESP,     description: Bốn vùng cache của service }
    - { from: log-producer,            to: banking/logs.queue,   technology: rabbitmq, description: Phát log qua logs.exchange }

c4:
  diagramType: classDiagram
  title: C4 — Mô hình dữ liệu Credit Card Service

  relationalDatabase:
    engine: PostgreSQL (image postgres:latest)
    database: banking-microservices
    schema: public
    migrationTool: none
    runtimeSchemaMutation: true
    encryptionAtRest: false
    sharedInstance: true
    connectionPool: { maxConns: 10 }

  entities:
    - name: credit_cards
      stereotype: aggregate-root
      description: Thẻ tín dụng của một người dùng, phát hành bởi một ngân hàng
      columns:
        - { name: id,              type: BIGSERIAL,          key: PK, nullable: false }
        - { name: card_number,     type: VARCHAR(20),        nullable: false, sensitive: true, description: Số thẻ lưu thô, không mã hoá, không che }
        - { name: user_id,         type: BIGINT,             nullable: false, description: Khoá ngoài LOGIC tới users.id, không có ràng buộc FK }
        - { name: expiration_date, type: DATE,               nullable: false, description: Trường khai @Past trong entity, ngược nghĩa với ngày hết hạn }
        - { name: cvv,             type: VARCHAR(4),         nullable: false, sensitive: true, description: CVV lưu thô — dữ liệu không được phép lưu trong hệ thống thật }
        - { name: credit_limit,    type: "DOUBLE PRECISION", nullable: false, description: Kiểu Double — không phù hợp cho số tiền, nên là NUMERIC }
        - { name: debt_amount,     type: "DOUBLE PRECISION", nullable: false, description: Kiểu Double — không phù hợp cho số tiền, nên là NUMERIC }
        - { name: bank_id,         type: BIGINT,             nullable: false, description: Khoá ngoài LOGIC tới banks.id, không có ràng buộc FK }
      constraints: []
      indexes: []

  relations: []

  externalRelations:
    - { from: credit_cards.user_id, to: banking/user-service, entity: users, cardinality: "*..1", fk: null, enforcedBy: application, description: Kiểm tra tồn tại bằng Feign lúc ghi, không ràng buộc ở CSDL }
    - { from: credit_cards.bank_id, to: banking/bank-service, entity: banks, cardinality: "*..1", fk: null, enforcedBy: application, description: Kiểm tra tồn tại bằng Feign lúc ghi, không ràng buộc ở CSDL }

  foreignTables:
    - { table: invoices, owner: banking/invoice-service, access: read-write, mode: "aggregate_query + status_update", usedBy: outstanding-debt-repository }

  externalReaders: []
