# user-service/catalog-info.yaml
# User Service — quản lý hồ sơ người dùng
# Chức năng: CRUD người dùng, cache Redis, phát log nghiệp vụ lên RabbitMQ và là nguồn
# dữ liệu user cho account-service, credit-card-service, invoice-service gọi vào
# ─────────────────────────────────────────────────────────────────────────────

# specVersion — phiên bản schema của IDP catalog declaration. Cố định: vsf-idp.io/v2
specVersion: vsf-idp.io/v2

metadata:
  # domain — domain nghiệp vụ chủ quản. Free-text, tối đa 128 ký tự.
  domain: banking  # require -> table: service.domain_code (VARCHAR 128)

  # system — bounded context. service_key = "{system}.{spec.id}"
  system: banking-system  # require -> table: service.system_code

  # namespace — K8s / IAM namespace scope
  namespace: banking  # require -> table: service.namespace

  labels:
    tier: "1"
    boundary: core
    pii: "true"
  annotations:
    repo: https://github.com/emre-unaldi/Banking-Microservices
    defaultBranch: main
    port: "8081"
    eurekaAppName: user-service-broken

spec:
  type: service
  id: user-service
  name: User Service
  description: >-
    Quản lý hồ sơ người dùng: tạo, sửa, xoá, tra cứu theo id và liệt kê. Mỗi thao tác đều
    phát một bản ghi log lên logs.exchange. Cung cấp API GET /api/v1/users/{userId} cho các service khác.
  owners:
    members:
      - user: emree.unaldi@gmail.com
        role: techlead
  review:
    branch: "main"
  runtime:
    language: Java 21
    framework: Spring Boot 3.2.4 / Spring Cloud 2023.0.1
    buildTool: maven
    libraries: [spring-boot-starter-data-jpa, spring-boot-starter-data-redis, spring-boot-starter-amqp, spring-cloud-starter-netflix-eureka-client, mapstruct-1.5.5, lombok]
    ports:
      - { number: 8081, name: http, protocol: http, exposure: cluster }
  dataClassification: confidential

  # topology — ref = "{kind}:{namespace}/{name}"
  topology:  # optional -> table: service_dependency
    # ── Membership ────────────────────────────────────────────────────────────
    - ref: system:banking/banking-system
      reason: Component này là một phần của system banking-system

    # ── APIs ──────────────────────────────────────────────────────────────────
    - ref: providesApis:banking/users-api
      protocol: http
      reason: API /api/v1/users cho gateway và ba service nghiệp vụ gọi vào

    # ── Infrastructure ────────────────────────────────────────────────────────
    - ref: component:banking/discovery-client-service
      protocol: http
      reason: Đăng ký instance với Eureka Server

    - ref: resource:banking/postgres-db
      protocol: postgresql
      reason: Bảng users trong database dùng chung banking-microservices

    - ref: resource:banking/redis-db
      protocol: redis
      reason: Cache user / users với prefix user-service

    - ref: resource:banking/rabbitmq-log
      protocol: rabbitmq
      reason: Broker nhận log nghiệp vụ

    # ── RabbitMQ queues ───────────────────────────────────────────────────────
    - ref: publishesTo:banking/logs.queue
      protocol: rabbitmq
      reason: Phát log mỗi thao tác POST/PUT/DELETE/GET qua logs.exchange

# ═════════════════════════════════════════════════════════════════════════════
# MÔ HÌNH C4 — hai cấp thuộc phạm vi service này
#
#   c3 → C4Component  : các khối bên trong container
#   c4 → classDiagram : lược đồ cơ sở dữ liệu service sở hữu
#
# C1 (Context) và C2 (Container) mô tả quan hệ GIỮA các service nên không service
# nào tự khai được — chúng nằm ở master-catalog.yaml tại gốc repo.
#
# Hai khoá c3/c4 là mở rộng cục bộ của repo, không thuộc lược đồ vsf-idp.io/v2.
# Bộ nạp catalog chấp nhận chúng vì schema đặt extra="allow", và bỏ qua khi dựng
# dependency graph.
#
# LƯU Ý KHI SỬA: file này là đầu vào của bộ dựng đồ thị. Một lỗi cú pháp YAML ở
# bất kỳ đâu bên dưới cũng làm service biến mất khỏi đồ thị — mất node, mất cạnh,
# và blast_radius của những service khác bị tính sai theo.
# ═════════════════════════════════════════════════════════════════════════════
c3:
  diagramType: C4Component
  title: C3 — Thành phần bên trong User Service

  components:
    - id: user-controller
      name: UserController
      technology: Spring MVC · /api/v1/users
      description: Năm endpoint POST / PUT / DELETE / GET by id / GET all
      exposedPort: 8081
    - id: user-service-impl
      name: UserServiceImpl
      technology: Spring @Service · @Cacheable / @CachePut / @CacheEvict
      description: Toàn bộ nghiệp vụ, tự gọi mapper, repository và log producer
    - id: user-mapper
      name: UserMapper
      technology: MapStruct 1.5.5
      description: Chuyển Request ↔ Entity ↔ DTO
    - id: user-repository
      name: UserRepository
      technology: Spring Data JPA · JpaRepository<User, Long>
      description: Chỉ dùng phương thức có sẵn, không khai query tuỳ biến
    - id: redis-cache
      name: RedisConfiguration
      technology: RedisCacheManager · TTL 1 giờ · prefix user-service
      description: Cấu hình cache user / users, serialize JSON có type info
    - id: log-producer
      name: LogProducer
      technology: Spring AMQP · logs.exchange
      description: convertAndSend theo routingKey logs.routingKey

  internalRelations:
    - { from: user-controller,   to: user-service-impl, description: Uỷ quyền toàn bộ nghiệp vụ }
    - { from: user-service-impl, to: user-repository,   description: Đọc/ghi bản ghi User }
    - { from: user-service-impl, to: user-mapper,       description: Chuyển Request/Entity/DTO }
    - { from: user-service-impl, to: redis-cache,       description: Đọc/xoá cache trước và sau mỗi thao tác }
    - { from: user-service-impl, to: log-producer,      description: Ghi log mỗi thao tác POST/PUT/DELETE/GET }

  externalRelations:
    - { from: user-repository, to: banking/postgres-db,   technology: JDBC,     description: Bảng users }
    - { from: redis-cache,     to: banking/redis-db,      technology: RESP,     description: Cache user / users }
    - { from: log-producer,    to: banking/logs.queue,    technology: rabbitmq, description: Phát log qua logs.exchange }

c4:
  diagramType: classDiagram
  title: C4 — Mô hình dữ liệu User Service

  relationalDatabase:
    engine: PostgreSQL (image postgres:latest)
    database: banking-microservices
    schema: public
    migrationTool: none
    runtimeSchemaMutation: true
    encryptionAtRest: false
    sharedInstance: true
    connectionPool: { maxConns: 1, connectionTimeoutMs: 2000 }

  entities:
    - name: users
      stereotype: aggregate-root
      description: Hồ sơ người dùng
      columns:
        - { name: id,           type: BIGSERIAL,     key: PK, nullable: false }
        - { name: username,     type: VARCHAR(50),   nullable: false }
        - { name: password,     type: VARCHAR(50),   nullable: false, sensitive: true, description: Mật khẩu người dùng }
        - { name: email,        type: VARCHAR(100),  nullable: false, pii: true }
        - { name: first_name,   type: VARCHAR(50),   nullable: false, pii: true }
        - { name: last_name,    type: VARCHAR(50),   nullable: false, pii: true }
        - { name: phone_number, type: VARCHAR(255),  nullable: false, pii: true }
        - { name: birth_date,   type: DATE,          nullable: false, pii: true }
        - { name: gender,       type: VARCHAR(255),  nullable: false, description: "Enum: MALE, FEMALE" }
      constraints: []
      indexes: []

  relations: []

  externalReaders:
    - { consumer: banking/account-service,     access: api-only, via: "GET /api/v1/users/{userId}" }
    - { consumer: banking/credit-card-service, access: api-only, via: "GET /api/v1/users/{userId}" }
    - { consumer: banking/invoice-service,     access: api-only, via: "GET /api/v1/users/{userId}" }
