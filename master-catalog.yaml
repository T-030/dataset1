specVersion: vsf-idp.io/v2

metadata:
  domain: banking

  system: banking-system

  namespace: banking

  labels:
    kind: system-declaration
  annotations:
    repo: https://github.com/emre-unaldi/Banking-Microservices
    defaultBranch: main
    version: "0.0.1-SNAPSHOT"

spec:
  type: documentation

  id: banking-master-system

  name: Banking Microservices Master

  description: >-
    Bản khai cấp hệ thống của nền tảng ngân hàng vi dịch vụ giả lập banking-system:
    chỉ mục catalog của 8 microservice, danh sách tác nhân, container, kho dữ liệu
    dùng chung và hàng đợi log. Là nguồn dữ liệu để dựng sơ đồ C1 và C2.

  owners:
    members:
      - user: emree.unaldi@gmail.com
        role: techlead

  review:
    branch: "main"

  topology:
    - ref: system:banking/banking-system
      reason: Bản khai cấp hệ thống của chính system banking-system

catalogRefs:
  - path: discovery-client-service/catalog-info.yaml
    serviceKey: banking-system.discovery-client-service
    nodeId: banking/discovery-client-service
    type: service
    tier: "0"
  - path: api-gateway-service/catalog-info.yaml
    serviceKey: banking-system.api-gateway-service
    nodeId: banking/api-gateway-service
    type: gateway
    tier: "0"
  - path: user-service/catalog-info.yaml
    serviceKey: banking-system.user-service
    nodeId: banking/user-service
    type: service
    tier: "1"
  - path: bank-service/catalog-info.yaml
    serviceKey: banking-system.bank-service
    nodeId: banking/bank-service
    type: service
    tier: "1"
  - path: credit-card-service/catalog-info.yaml
    serviceKey: banking-system.credit-card-service
    nodeId: banking/credit-card-service
    type: service
    tier: "2"
  - path: account-service/catalog-info.yaml
    serviceKey: banking-system.account-service
    nodeId: banking/account-service
    type: service
    tier: "2"
  - path: invoice-service/catalog-info.yaml
    serviceKey: banking-system.invoice-service
    nodeId: banking/invoice-service
    type: service
    tier: "2"
  - path: log-service/catalog-info.yaml
    serviceKey: banking-system.log-service
    nodeId: banking/log-service
    type: service
    tier: "2"

namespaces: [banking]

c1:
  diagramType: C4Context
  title: C1 — Bối cảnh hệ thống banking-system

  persons:
    - id: api-consumer
      name: Ứng dụng khách / người dùng API
      description: >-
        Gọi REST API qua API Gateway. Repo không kèm giao diện người dùng; kênh truy cập
        thực tế là Postman collection trong documentation/ hoặc bất kỳ HTTP client nào.
      channels: [rest-api]
    - id: platform-engineer
      name: Kỹ sư nền tảng
      description: Dựng cụm bằng docker-compose, theo dõi registry Eureka và các UI quản trị
      channels: [docker-compose, eureka-dashboard, admin-uis]

  softwareSystems:
    - id: banking-system
      name: banking-system
      description: Hệ thống ngân hàng vi dịch vụ giả lập giao dịch cơ bản — 8 microservice
      external: false
      containerCount: 8

  externalSystems: []

  relations:
    - { from: api-consumer,       to: banking-system, description: Gọi CRUD user, bank, credit card, account, invoice, log, protocol: HTTP · :8087 }
    - { from: platform-engineer,  to: banking-system, description: Dựng cụm, kiểm tra registry và trạng thái service, protocol: docker-compose · HTTP }

c2:
  diagramType: C4Container
  title: C2 — Container trong hệ thống banking-system

  boundaries:
    - { id: edge,     name: Edge — lối vào duy nhất }
    - { id: platform, name: Platform — discovery và log tập trung }
    - { id: core,     name: Core Banking — nghiệp vụ ngân hàng }
    - { id: shared,   name: Shared — hạ tầng dùng chung }

  containers:
    - id: banking/discovery-client-service
      name: Discovery Client Service
      boundary: platform
      type: service
      technology: Java 21 / Spring Boot 3.2.4 / Netflix Eureka Server
      tier: "0"
      ports: [8761]
      catalog: discovery-client-service/catalog-info.yaml
    - id: banking/api-gateway-service
      name: API Gateway Service
      boundary: edge
      type: gateway
      technology: Java 21 / Spring Cloud Gateway 2023.0.1
      tier: "0"
      ports: [8087]
      catalog: api-gateway-service/catalog-info.yaml
    - id: banking/user-service
      name: User Service
      boundary: core
      type: service
      technology: Java 21 / Spring Boot 3.2.4 / JPA + Redis + AMQP
      tier: "1"
      ports: [8081]
      catalog: user-service/catalog-info.yaml
    - id: banking/bank-service
      name: Bank Service
      boundary: core
      type: service
      technology: Java 21 / Spring Boot 3.2.4 / JPA + Redis + AMQP
      tier: "1"
      ports: [8082]
      catalog: bank-service/catalog-info.yaml
    - id: banking/credit-card-service
      name: Credit Card Service
      boundary: core
      type: service
      technology: Java 21 / Spring Boot 3.2.4 / JPA + Redis + AMQP + OpenFeign
      tier: "2"
      ports: [8083]
      catalog: credit-card-service/catalog-info.yaml
    - id: banking/account-service
      name: Account Service
      boundary: core
      type: service
      technology: Java 21 / Spring Boot 3.2.4 / JPA + Redis + AMQP + OpenFeign
      tier: "2"
      ports: [8084]
      catalog: account-service/catalog-info.yaml
    - id: banking/invoice-service
      name: Invoice Service
      boundary: core
      type: service
      technology: Java 21 / Spring Boot 3.2.4 / JPA + Redis + AMQP + OpenFeign
      tier: "2"
      ports: [8085]
      catalog: invoice-service/catalog-info.yaml
    - id: banking/log-service
      name: Log Service
      boundary: platform
      type: service
      technology: Java 21 / Spring Boot 3.2.4 / MongoDB + AMQP
      tier: "2"
      ports: [8086]
      catalog: log-service/catalog-info.yaml

  datastores:
    - id: banking/postgres-db
      name: PostgreSQL banking-microservices
      technology: postgres:latest · cổng 5433→5432
      ownedBy: shared
      readBy:
        - banking/user-service
        - banking/bank-service
        - banking/credit-card-service
        - banking/account-service
        - banking/invoice-service
      tables:
        - { table: users,        owner: banking/user-service }
        - { table: banks,        owner: banking/bank-service }
        - { table: credit_cards, owner: banking/credit-card-service }
        - { table: accounts,     owner: banking/account-service }
        - { table: invoices,     owner: banking/invoice-service, alsoWrittenBy: [banking/credit-card-service] }
    - id: banking/redis-db
      name: Redis cache
      technology: redis:latest · cổng 6380→6379 · database index 1 khi chạy compose
      ownedBy: shared
      readBy:
        - banking/user-service
        - banking/bank-service
        - banking/credit-card-service
        - banking/account-service
        - banking/invoice-service
      keyPrefixes:
        - { prefix: "user-service:",        owner: banking/user-service }
        - { prefix: "bank-service:",        owner: banking/bank-service }
        - { prefix: "credit-card-service:", owner: banking/credit-card-service }
        - { prefix: "account-service:",     owner: banking/account-service }
        - { prefix: "invoice-service:",     owner: banking/invoice-service }
    - id: banking/rabbitmq-log
      name: RabbitMQ log broker
      technology: rabbitmq:3.13-management · cổng 5672 / 15672
      ownedBy: shared
      readBy: [banking/log-service]
    - id: banking/mongo
      name: MongoDB banking-microservices
      technology: mongo:latest · cổng 27018→27017 · collection logs
      ownedBy: banking/log-service
      readBy: []

  messageTopics:
    - id: banking/logs.queue
      exchange: logs.exchange
      exchangeType: direct
      routingKey: logs.routingKey
      durable: false
      producers:
        - banking/user-service
        - banking/bank-service
        - banking/credit-card-service
        - banking/account-service
        - banking/invoice-service
      consumers: [banking/log-service, banking/invoice-service]

  relations:
    - { from: banking/api-gateway-service,  to: banking/discovery-client-service, style: sync, protocol: HTTP, description: Đăng ký và lấy registry để phân giải lb:// }
    - { from: banking/user-service,         to: banking/discovery-client-service, style: sync, protocol: HTTP, description: Đăng ký instance }
    - { from: banking/bank-service,         to: banking/discovery-client-service, style: sync, protocol: HTTP, description: Đăng ký instance }
    - { from: banking/credit-card-service,  to: banking/discovery-client-service, style: sync, protocol: HTTP, description: Đăng ký instance }
    - { from: banking/account-service,      to: banking/discovery-client-service, style: sync, protocol: HTTP, description: Đăng ký instance }
    - { from: banking/invoice-service,      to: banking/discovery-client-service, style: sync, protocol: HTTP, description: Đăng ký instance }
    - { from: banking/log-service,          to: banking/discovery-client-service, style: sync, protocol: HTTP, description: Đăng ký instance }

    - { from: banking/api-gateway-service, to: banking/user-service,        style: sync, protocol: HTTP, description: "routes[0] /api/v1/users/** → lb://USER-SERVICE" }
    - { from: banking/api-gateway-service, to: banking/bank-service,        style: sync, protocol: HTTP, description: "routes[1] /api/v1/banks/** → lb://BANK-SERVICE" }
    - { from: banking/api-gateway-service, to: banking/credit-card-service, style: sync, protocol: HTTP, description: "routes[2] /api/v1/creditCards/** → lb://CREDIT-CARD-SERVICE" }
    - { from: banking/api-gateway-service, to: banking/account-service,     style: sync, protocol: HTTP, description: "routes[3] /api/v1/accounts/** → lb://ACCOUNT-SERVICE" }
    - { from: banking/api-gateway-service, to: banking/invoice-service,     style: sync, protocol: HTTP, description: "routes[4] /api/v1/invoices/** → lb://INVOICE-SERVICE" }
    - { from: banking/api-gateway-service, to: banking/log-service,         style: sync, protocol: HTTP, description: "routes[5] /api/v1/logs/** → lb://LOG-SERVICE" }

    - { from: banking/account-service,     to: banking/user-service, style: sync, protocol: HTTP, description: "GET /api/v1/users/{userId} kiểm tra user tồn tại" }
    - { from: banking/account-service,     to: banking/bank-service, style: sync, protocol: HTTP, description: "GET /api/v1/banks/{bankId} kiểm tra bank tồn tại" }
    - { from: banking/credit-card-service, to: banking/user-service, style: sync, protocol: HTTP, description: "GET /api/v1/users/{userId} kiểm tra user tồn tại" }
    - { from: banking/credit-card-service, to: banking/bank-service, style: sync, protocol: HTTP, description: "GET /api/v1/banks/{bankId} kiểm tra bank tồn tại" }
    - { from: banking/credit-card-service, to: banking/invoice-service, style: sync, protocol: HTTP, description: GET /api/v1/invoices lấy hoá đơn để tính dư nợ ban đầu }
    - { from: banking/invoice-service,     to: banking/user-service, style: sync, protocol: HTTP, description: "GET /api/v1/users/{userId} kiểm tra user tồn tại" }
    - { from: banking/invoice-service,     to: banking/credit-card-service, style: sync, protocol: HTTP, description: "GET /api/v1/creditCards/users/{userId} xác nhận khách hàng đã có thẻ" }
    - { from: banking/invoice-service,     to: banking/credit-card-service, style: sync, protocol: HTTP, description: GET /api/v1/creditCards rồi PUT /api/v1/creditCards để cộng dư nợ thẻ }

    - { from: banking/user-service,        to: banking/logs.queue, style: async, protocol: AMQP, description: Phát log mỗi thao tác POST/PUT/DELETE/GET }
    - { from: banking/bank-service,        to: banking/logs.queue, style: async, protocol: AMQP, description: Phát log mỗi thao tác POST/PUT/DELETE/GET }
    - { from: banking/credit-card-service, to: banking/logs.queue, style: async, protocol: AMQP, description: Phát log mỗi thao tác POST/PUT/DELETE/GET }
    - { from: banking/account-service,     to: banking/logs.queue, style: async, protocol: AMQP, description: Phát log mỗi thao tác POST/PUT/DELETE/GET }
    - { from: banking/invoice-service,     to: banking/logs.queue, style: async, protocol: AMQP, description: Phát log mỗi thao tác POST/PUT/DELETE/GET }
    - { from: banking/logs.queue,          to: banking/log-service, style: async, protocol: AMQP, description: "@RabbitListener đọc và ghi thẳng xuống MongoDB" }
    - { from: banking/logs.queue,          to: banking/invoice-service, style: async, protocol: AMQP, description: "@RabbitListener đếm số thao tác hoá đơn" }

    - { from: banking/user-service,        to: banking/postgres-db, style: sync, protocol: JDBC,          description: Bảng users }
    - { from: banking/bank-service,        to: banking/postgres-db, style: sync, protocol: JDBC,          description: Bảng banks }
    - { from: banking/credit-card-service, to: banking/postgres-db, style: sync, protocol: JDBC,          description: Bảng credit_cards, truy vấn tổng hợp và cập nhật trạng thái trên bảng invoices }
    - { from: banking/account-service,     to: banking/postgres-db, style: sync, protocol: JDBC,          description: Bảng accounts }
    - { from: banking/invoice-service,     to: banking/postgres-db, style: sync, protocol: JDBC,          description: Bảng invoices }
    - { from: banking/user-service,        to: banking/redis-db,    style: sync, protocol: RESP,          description: Cache user / users }
    - { from: banking/bank-service,        to: banking/redis-db,    style: sync, protocol: RESP,          description: Cache bank / banks }
    - { from: banking/credit-card-service, to: banking/redis-db,    style: sync, protocol: RESP,          description: Cache credit_card / credit_cards / credit_card_user / credit_card_bank }
    - { from: banking/account-service,     to: banking/redis-db,    style: sync, protocol: RESP,          description: Cache account / accounts / account_user / account_bank }
    - { from: banking/invoice-service,     to: banking/redis-db,    style: sync, protocol: RESP,          description: Cache invoice / invoices / invoice_user }
    - { from: banking/log-service,         to: banking/mongo,       style: sync, protocol: MongoDB Wire,  description: Collection logs }

  opsTools:
    - { id: banking/pg-admin,      name: pgAdmin 4,           port: 5050,  targets: [banking/postgres-db] }
    - { id: banking/redis-insight, name: RedisInsight,        port: 5540,  targets: [banking/redis-db] }
    - { id: banking/rabbitmq-ui,   name: RabbitMQ Management, port: 15672, targets: [banking/rabbitmq-log] }
    - { id: banking/mongo-express, name: Mongo Express,       port: 8088,  targets: [banking/mongo] }
