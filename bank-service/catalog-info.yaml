specVersion: vsf-idp.io/v2

metadata:
  domain: banking

  system: banking-system

  namespace: banking

  labels:
    tier: "1"
    boundary: core
    pii: "false"
  annotations:
    repo: https://github.com/emre-unaldi/Banking-Microservices
    defaultBranch: main
    port: "8082"

spec:
  type: service

  id: bank-service

  name: Bank Service

  description: >-
    Quản lý dữ liệu chủ về ngân hàng và chi nhánh: tên, mã ngân hàng, mã chi nhánh, số
    tài khoản đầu mối và thông tin liên hệ. Không gọi service nào khác — đây là service
    nghiệp vụ duy nhất không có Feign client. Account và Credit Card gọi vào để kiểm tra
    bankId tồn tại trước khi lưu.

  owners:
    members:
      - user: emree.unaldi@gmail.com
        role: techlead

  review:
    branch: "main"

  runtime:
    language: Java 21
    framework: Spring Boot 3.2.4 / Spring Cloud 2023.0.1
    buildTool: maven
    libraries: [spring-boot-starter-data-jpa, spring-boot-starter-data-redis, spring-boot-starter-amqp, spring-cloud-starter-netflix-eureka-client, mapstruct-1.5.5, lombok]
    ports:
      - { number: 8082, name: http, protocol: http, exposure: cluster }
  dataClassification: internal

  topology:
    - ref: system:banking/banking-system
      reason: Component này là một phần của system banking-system

    - ref: providesApis:banking/banks-api
      protocol: http
      reason: API /api/v1/banks cho gateway, account-service và credit-card-service

    - ref: component:banking/discovery-client-service
      protocol: http
      reason: Đăng ký instance với Eureka Server

    - ref: resource:banking/postgres-db
      protocol: postgresql
      reason: Bảng banks trong database dùng chung banking-microservices

    - ref: resource:banking/redis-db
      protocol: redis
      reason: Cache bank / banks với prefix bank-service

    - ref: resource:banking/rabbitmq-log
      protocol: rabbitmq
      reason: Broker nhận log nghiệp vụ

    - ref: publishesTo:banking/logs.queue
      protocol: rabbitmq
      reason: Phát log mỗi thao tác POST/PUT/DELETE/GET qua logs.exchange

c3:
  diagramType: C4Component
  title: C3 — Thành phần bên trong Bank Service

  components:
    - id: bank-controller
      name: BankController
      technology: Spring MVC · /api/v1/banks
      description: Năm endpoint POST / PUT / DELETE / GET by id / GET all
      exposedPort: 8082
    - id: bank-service-impl
      name: BankServiceImpl
      technology: Spring @Service · @Cacheable / @CachePut / @CacheEvict
      description: Toàn bộ nghiệp vụ, tự gọi mapper, repository và log producer
    - id: bank-mapper
      name: BankMapper
      technology: MapStruct 1.5.5
      description: Chuyển Request ↔ Entity ↔ DTO
    - id: bank-repository
      name: BankRepository
      technology: Spring Data JPA · JpaRepository<Bank, Long>
      description: Chỉ dùng phương thức có sẵn, không khai query tuỳ biến
    - id: redis-cache
      name: RedisConfiguration
      technology: RedisCacheManager · TTL 1 giờ · prefix bank-service
      description: Cấu hình cache bank / banks, serialize JSON có type info
    - id: log-producer
      name: LogProducer
      technology: Spring AMQP · logs.exchange
      description: convertAndSend theo routingKey logs.routingKey

  internalRelations:
    - { from: bank-controller,   to: bank-service-impl, description: Uỷ quyền toàn bộ nghiệp vụ }
    - { from: bank-service-impl, to: bank-repository,   description: Đọc/ghi bản ghi Bank }
    - { from: bank-service-impl, to: bank-mapper,       description: Chuyển Request/Entity/DTO }
    - { from: bank-service-impl, to: redis-cache,       description: Đọc/xoá cache trước và sau mỗi thao tác }
    - { from: bank-service-impl, to: log-producer,      description: Ghi log mỗi thao tác POST/PUT/DELETE/GET }

  externalRelations:
    - { from: bank-repository, to: banking/postgres-db, technology: JDBC,     description: Bảng banks }
    - { from: redis-cache,     to: banking/redis-db,    technology: RESP,     description: Cache bank / banks }
    - { from: log-producer,    to: banking/logs.queue,  technology: rabbitmq, description: Phát log qua logs.exchange }

c4:
  diagramType: classDiagram
  title: C4 — Mô hình dữ liệu Bank Service

  relationalDatabase:
    engine: PostgreSQL (image postgres:latest)
    database: banking-microservices
    schema: public
    migrationTool: none
    runtimeSchemaMutation: true
    encryptionAtRest: false
    sharedInstance: true
    connectionPool: { maxConns: 10 }

  entities:
    - name: banks
      stereotype: aggregate-root
      description: Ngân hàng và chi nhánh, khoá ngoại logic của accounts và credit_cards
      columns:
        - { name: id,             type: BIGSERIAL,    key: PK, nullable: false }
        - { name: bank_name,      type: VARCHAR(100), nullable: false }
        - { name: bank_code,      type: VARCHAR(20),  nullable: false }
        - { name: branch_name,    type: VARCHAR(100), nullable: false }
        - { name: branch_code,    type: VARCHAR(20),  nullable: false }
        - { name: account_number, type: VARCHAR(20),  nullable: false, description: Số tài khoản đầu mối của chi nhánh }
        - { name: address,        type: VARCHAR(250), nullable: false }
        - { name: email,          type: VARCHAR(250), nullable: false }
        - { name: phone_number,   type: VARCHAR(250), nullable: false }
      constraints: []
      indexes: []

  relations: []

  externalReaders:
    - { consumer: banking/account-service,     access: api-only, via: "GET /api/v1/banks/{bankId}" }
    - { consumer: banking/credit-card-service, access: api-only, via: "GET /api/v1/banks/{bankId}" }
