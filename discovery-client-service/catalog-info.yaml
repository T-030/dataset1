specVersion: vsf-idp.io/v2

metadata:
  domain: platform

  system: banking-system

  namespace: banking

  labels:
    tier: "0"
    boundary: platform
    stateful: "false"
  annotations:
    repo: https://github.com/emre-unaldi/Banking-Microservices
    defaultBranch: main
    port: "8761"
    dashboard: http://localhost:8761

spec:
  type: service

  id: discovery-client-service

  name: Discovery Client Service

  description: >-
    Eureka Server (@EnableEurekaServer) giữ service registry của toàn hệ thống. Bản thân
    nó không đăng ký với ai (register-with-eureka=false, fetch-registry=false) và không
    sở hữu kho dữ liệu nào — registry nằm hoàn toàn trong bộ nhớ. Mọi service khác đều
    phụ thuộc vào nó, docker-compose chặn chúng khởi động tới khi healthcheck :8761 xanh.

  owners:
    members:
      - user: emree.unaldi@gmail.com
        role: techlead

  review:
    branch: "main"

  runtime:
    language: Java 21
    framework: Spring Boot 3.2.4 / Spring Cloud 2023.0.1
    buildTool: maven
    libraries: [spring-cloud-starter-netflix-eureka-server, spring-boot-starter-actuator]
    ports:
      - { number: 8761, name: http, protocol: http, exposure: cluster }
  dataClassification: internal
  statePersistence: none

  topology:
    - ref: system:banking/banking-system
      reason: Component này là một phần của system banking-system

    - ref: providesApis:banking/eureka-api
      protocol: http
      reason: /eureka — nhận đăng ký instance và trả registry cho client

c3:
  diagramType: C4Component
  title: C3 — Thành phần bên trong Discovery Client Service

  components:
    - id: eureka-server
      name: DiscoveryClientServiceApplication
      technology: "@SpringBootApplication + @EnableEurekaServer"
      description: Bật Eureka Server, phục vụ registry tại /eureka trên cổng 8761
      exposedPort: 8761
    - id: registry-store
      name: Eureka Registry (in-memory)
      technology: Netflix Eureka
      description: >-
        Bảng instance trong bộ nhớ. Self-preservation và eviction để mặc định; hai tham số
        eureka.server.enable-self-preservation / eviction-interval-timer-in-ms nằm sẵn
        trong application.properties dưới dạng comment để mô phỏng sự cố giữ instance chết.
    - id: actuator
      name: Spring Boot Actuator
      technology: management.endpoints.web.exposure.include=*
      description: Cung cấp /actuator/health cho healthcheck của docker-compose

  internalRelations:
    - { from: eureka-server, to: registry-store, description: Ghi và đọc bảng instance }
    - { from: eureka-server, to: actuator,       description: Công bố trạng thái sức khoẻ }

  externalRelations: []
