specVersion: vsf-idp.io/v2

metadata:
  domain: platform

  system: banking-system

  namespace: banking

  labels:
    tier: "2"
    boundary: platform
    pii: "false"
  annotations:
    repo: https://github.com/emre-unaldi/Banking-Microservices
    defaultBranch: main
    port: "8086"

spec:
  type: service

  id: log-service

  name: Log Service

  description: >-
    Điểm tập kết log của cả hệ thống. Năm service nghiệp vụ phát bản ghi log lên
    logs.exchange; service này lắng nghe logs.queue, ánh xạ LogResponse thành Log và lưu
    vào collection logs trên MongoDB. Đồng thời lộ REST CRUD /api/v1/logs để tra cứu.
    Là service duy nhất dùng MongoDB và là consumer duy nhất của hàng đợi.

  owners:
    members:
      - user: emree.unaldi@gmail.com
        role: techlead

  review:
    branch: "main"

  runtime:
    language: Java 21
    framework: Spring Boot 3.2.4 / Spring Cloud 2023.0.1
    buildTool: maven
    libraries: [spring-boot-starter-data-mongodb, spring-boot-starter-amqp, spring-cloud-starter-netflix-eureka-client, mapstruct-1.5.5, lombok]
    ports:
      - { number: 8086, name: http, protocol: http, exposure: cluster }
  dataClassification: internal
  consumerPolicy:
    concurrency: default
    deadLetterQueue: none
    retry: none

  topology:
    - ref: system:banking/banking-system
      reason: Component này là một phần của system banking-system

    - ref: providesApis:banking/logs-api
      protocol: http
      reason: API /api/v1/logs cho gateway định tuyến vào để tra cứu log

    - ref: component:banking/discovery-client-service
      protocol: http
      reason: Đăng ký instance với Eureka Server

    - ref: resource:banking/mongo
      protocol: mongodb
      reason: Collection logs trong database banking-microservices

    - ref: resource:banking/rabbitmq-log
      protocol: rabbitmq
      reason: Broker cung cấp hàng đợi log

    - ref: consumesFrom:banking/logs.queue
      protocol: rabbitmq
      reason: Nhận log do 5 service nghiệp vụ phát lên và lưu xuống MongoDB

c3:
  diagramType: C4Component
  title: C3 — Thành phần bên trong Log Service

  components:
    - id: log-controller
      name: LogController
      technology: Spring MVC · /api/v1/logs
      description: Năm endpoint POST / PUT / DELETE / GET by id / GET all
      exposedPort: 8086
    - id: log-consumer
      name: LogConsumer
      technology: "@RabbitListener · logs.queue"
      description: >-
        Nhận LogResponse, ánh xạ bằng LogMapper.INSTANCE rồi gọi thẳng repository —
        bỏ qua LogServiceImpl, nên hai đường ghi không dùng chung logic nghiệp vụ
    - id: log-service-impl
      name: LogServiceImpl
      technology: Spring @Service
      description: Nghiệp vụ cho đường REST, không cache
    - id: log-mapper
      name: LogMapper
      technology: MapStruct 1.5.5
      description: Chuyển Request/Response ↔ Entity ↔ DTO
    - id: log-repository
      name: LogRepository
      technology: Spring Data MongoDB · MongoRepository<Log, String>
      description: Chỉ dùng phương thức có sẵn, không khai query tuỳ biến

  internalRelations:
    - { from: log-controller,  to: log-service-impl, description: Uỷ quyền toàn bộ nghiệp vụ }
    - { from: log-consumer,    to: log-mapper,       description: Chuyển LogResponse thành Log }
    - { from: log-consumer,    to: log-repository,   description: Lưu thẳng bản ghi Log xuống MongoDB }
    - { from: log-service-impl, to: log-repository,  description: Đọc/ghi bản ghi Log }
    - { from: log-service-impl, to: log-mapper,      description: Chuyển Request/Entity/DTO }

  externalRelations:
    - { from: log-repository, to: banking/mongo, technology: MongoDB Wire, description: Collection logs trong banking-microservices }

c4:
  diagramType: classDiagram
  title: C4 — Mô hình dữ liệu Log Service

  documentDatabase:
    engine: MongoDB (image mongo:latest)
    database: banking-microservices
    authenticationDatabase: admin
    schemaEnforcement: none
    encryptionAtRest: false
    connectionPool: { maxConns: 100 }

  collections:
    - name: logs
      stereotype: aggregate-root
      description: Một bản ghi log do service nghiệp vụ phát ra, hoặc tạo tay qua REST
      fields:
        - { name: _id,            type: ObjectId,  key: PK, nullable: false, description: Ánh xạ vào thuộc tính String id }
        - { name: service_name,   type: string,    nullable: true, description: Tên service phát log, ví dụ account-service }
        - { name: operation_type, type: string,    nullable: true, description: "Enum: POST, PUT, DELETE, GET" }
        - { name: log_type,       type: string,    nullable: true, description: "Enum: ERROR, WARN, INFO" }
        - { name: message,        type: string,    nullable: true }
        - { name: timestamp,      type: date,      nullable: true, description: LocalDateTime do phía phát tự gán }
        - { name: exception,      type: string,    nullable: true, description: Rỗng với log thành công }
      indexes: []
      retentionPolicy: null

  relations: []

  writers:
    - { producer: banking/user-service,        via: banking/logs.queue, path: LogConsumer }
    - { producer: banking/bank-service,        via: banking/logs.queue, path: LogConsumer }
    - { producer: banking/credit-card-service, via: banking/logs.queue, path: LogConsumer }
    - { producer: banking/account-service,     via: banking/logs.queue, path: LogConsumer }
    - { producer: banking/invoice-service,     via: banking/logs.queue, path: LogConsumer }
    - { producer: banking/api-gateway-service, via: banking/logs-api,   path: LogController, note: Đường REST mở cho mọi client qua gateway }

  externalReaders: []
